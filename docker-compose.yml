services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    volumes:
      - .:/var/www/html
    depends_on:
      - mysql
      - redis
      - evolution-api
    environment:
      APP_ENV: production
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_DATABASE: financial
      DB_USERNAME: financial
      DB_PASSWORD: secret
      REDIS_HOST: redis
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      WHATSAPP_PROVIDER: evolution
      EVOLUTION_API_URL: http://evolution-api:8080
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-change-me}
      EVOLUTION_INSTANCE_NAME: ${EVOLUTION_INSTANCE_NAME:-financial-system}

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: financial
      MYSQL_USER: financial
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init-evolution.sql:/docker-entrypoint-initdb.d/02-evolution.sql:ro

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"

  horizon:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: php artisan horizon
    depends_on:
      - mysql
      - redis
    volumes:
      - .:/var/www/html
    environment:
      QUEUE_CONNECTION: redis
      REDIS_HOST: redis

  scheduler:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: php artisan schedule:work
    depends_on:
      - mysql
      - redis
    volumes:
      - .:/var/www/html

  evolution-api:
    # homolog: correções de QR (count 0) presentes em builds mais novos que v2.2.3
    image: atendai/evolution-api:homolog
    restart: unless-stopped
    ports:
      - "8081:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - mysql
      - redis
    environment:
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-change-me}
      SERVER_URL: ${EVOLUTION_SERVER_URL:-http://127.0.0.1:8081}
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: mysql
      DATABASE_CONNECTION_URI: mysql://financial:secret@mysql:3306/evolution
      DATABASE_CONNECTION_CLIENT_NAME: evolution_financial
      # Workaround QR vazio (issues #2068 / #2437): cache local + menos persistência
      CACHE_REDIS_ENABLED: "false"
      CACHE_LOCAL_ENABLED: "true"
      CONFIG_SESSION_PHONE_CLIENT: Chrome
      CONFIG_SESSION_PHONE_VERSION: "2.3000.1033773198"
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "false"
      DATABASE_SAVE_DATA_CONTACTS: "false"
      DATABASE_SAVE_DATA_CHATS: "false"
      DATABASE_SAVE_DATA_HISTORIC: "false"
      DATABASE_SAVE_DATA_LABELS: "false"
    volumes:
      - evolution_instances:/evolution/instances

volumes:
  mysql_data:
  evolution_instances:
